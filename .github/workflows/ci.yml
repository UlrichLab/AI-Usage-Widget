name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile application
        run: python -m py_compile src/ai_usage_widget.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate macOS packaging files
        if: runner.os == 'macOS'
        run: |
          sh -n scripts/macos/install.sh
          sh -n scripts/macos/uninstall.sh
          sh -n packaging/macos/ai-usage-widget
          plutil -lint packaging/macos/Info.plist
