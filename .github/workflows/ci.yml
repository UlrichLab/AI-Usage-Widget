name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: python -m pip install -r requirements-macos.txt pyinstaller

      - name: Compile application
        run: python -m py_compile src/ai_usage_widget.py

      - name: Compile macOS application
        if: runner.os == 'macOS'
        run: python -m py_compile src/ai_usage_widget_macos.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate macOS packaging files
        if: runner.os == 'macOS'
        run: |
          sh -n scripts/macos/install.sh
          sh -n scripts/macos/uninstall.sh
          sh -n packaging/macos/ai-usage-widget
          plutil -lint packaging/macos/Info.plist
          plutil -lint packaging/macos/widget/Info.plist

      - name: Build WidgetKit extension
        if: runner.os == 'macOS'
        run: >-
          xcodebuild -quiet
          -project packaging/macos/widget-host/AIUsageWidgetHost.xcodeproj
          -scheme AIUsageWidgetHost
          -configuration Release
          -derivedDataPath "${{ runner.temp }}/AIUsageWidgetDerivedData"
          CODE_SIGNING_ALLOWED=NO
          AI_USAGE_BUNDLE_SUFFIX=cicheck
          build

      - name: Build app-only macOS bundle
        if: runner.os == 'macOS'
        run: |
          python packaging/macos/generate_icon.py "${{ runner.temp }}/AIUsageWidget.icns"
          python -m PyInstaller --noconfirm --clean --windowed --onedir \
            --name "AI Usage Widget" \
            --icon "${{ runner.temp }}/AIUsageWidget.icns" \
            --osx-bundle-identifier com.ulrichlab.ai-usage-widget \
            --hidden-import pystray._darwin \
            --distpath "${{ runner.temp }}/ai-usage-widget-dist" \
            --workpath "${{ runner.temp }}/ai-usage-widget-work" \
            --specpath "${{ runner.temp }}/ai-usage-widget-spec" \
            src/ai_usage_widget_macos.py
          test -d "${{ runner.temp }}/ai-usage-widget-dist/AI Usage Widget.app"
          test ! -d "${{ runner.temp }}/ai-usage-widget-dist/AI Usage Widget.app/Contents/PlugIns"
